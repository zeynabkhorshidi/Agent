services:
  sellora:
    build: .
    ports: ["127.0.0.1:8000:8000"]
    environment:
      SELLORA_ENV: development
      SELLORA_ADMIN_PASSWORD: ${SELLORA_ADMIN_PASSWORD:?set a strong admin password}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      SELLORA_SALES_PASSWORD: ${SELLORA_SALES_PASSWORD:-}
      SELLORA_OPERATOR_PASSWORD: ${SELLORA_OPERATOR_PASSWORD:-}
      STT_BASE_URL: ${STT_BASE_URL:-http://172.20.3.81:30089}
      STT_ONLINE_TIMEOUT: ${STT_ONLINE_TIMEOUT:-45}
      STT_OFFLINE_TIMEOUT: ${STT_OFFLINE_TIMEOUT:-120}
      STT_MAX_UPLOAD_MB: ${STT_MAX_UPLOAD_MB:-25}
      CATALOG_URL: ${CATALOG_URL:-https://catalog.sayesaman.com/}
      CATALOG_AUTO_SYNC: ${CATALOG_AUTO_SYNC:-true}
      SELLORA_SEED_CUSTOMERS: ${SELLORA_SEED_CUSTOMERS:-true}
      CATALOG_MODE: ${CATALOG_MODE:-api}
      CATALOG_SYNC_TIMEOUT: ${CATALOG_SYNC_TIMEOUT:-900}
      CATALOG_MAX_PAGES: ${CATALOG_MAX_PAGES:-200}
      CATALOG_IMAGE_HOSTS: ${CATALOG_IMAGE_HOSTS:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_MODEL: ${LLM_MODEL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      TTS_ENDPOINT: ${TTS_ENDPOINT:-}
      TTS_MODEL: ${TTS_MODEL:-}
      TTS_VOICE: ${TTS_VOICE:-}
      TTS_API_KEY: ${TTS_API_KEY:-}
    volumes:
      - sellora-data:/app/data
    restart: unless-stopped
volumes:
  sellora-data:
